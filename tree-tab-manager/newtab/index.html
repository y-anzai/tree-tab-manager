<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <style>
        :root {
            --bg: #1e1e2e;
            --text: #cdd6f4;
            --accent: #89b4fa;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 48px;
            font-weight: 200;
            margin-bottom: 24px;
            letter-spacing: -1px;
        }

        .search-box {
            width: 560px;
            position: relative;
        }

        input {
            width: 100%;
            padding: 14px 24px;
            font-size: 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            outline: none;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .quick-links {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .link-item {
            color: #6c7086;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s;
        }

        .link-item:hover {
            color: var(--accent);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 id="time">00:00</h1>
        <div class="search-box">
            <form action="https://www.google.com/search" method="GET">
                <input type="text" name="q" placeholder="Google で検索..." autofocus>
            </form>
        </div>
        <div class="quick-links">
            <a href="https://github.com" class="link-item">GitHub</a>
            <a href="https://gmail.com" class="link-item">Gmail</a>
            <a href="https://youtube.com" class="link-item">YouTube</a>
            <a href="https://twitter.com" class="link-item">Twitter</a>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('time').textContent = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
    <!-- ミニツリー用スクリプトのロード。ここでは content script と同じファイルをロードする -->
    <script src="../content/mini-tree.js"></script>
</body>

</html>

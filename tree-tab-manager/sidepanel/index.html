<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="extName">Tree Tab Manager</title>
  <link rel="stylesheet" href="panel.css">
</head>

<body>
  <!-- ヘッダー（タイトル重複防止のため非表示設定） -->
  <header class="header" style="display: none;">
    <div class="header-title">
      <svg class="header-icon" viewBox="0 0 20 20" fill="currentColor">
        <path
          d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z" />
      </svg>
      <span class="header-title-text" data-i18n="extName">Tree Tab Manager</span>
    </div>
  </header>

  <!-- タブナビゲーション -->
  <nav class="tab-nav" id="main-nav">
    <button class="tab-btn active" data-panel="tabs">
      <svg viewBox="0 0 20 20" fill="currentColor">
        <path
          d="M3 3a1 1 0 000 2h11a1 1 0 100-2H3zM3 7a1 1 0 000 2h5a1 1 0 000-2H3zM3 11a1 1 0 100 2h4a1 1 0 100-2H3zM13 16a1 1 0 102 0v-5.586l1.293 1.293a1 1 0 001.414-1.414l-3-3a1 1 0 00-1.414 0l-3 3a1 1 0 101.414 1.414L13 10.414V16z" />
      </svg>
      タブ
    </button>
    <button class="tab-btn" data-panel="history">
      <svg viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z"
          clip-rule="evenodd" />
      </svg>
      履歴
    </button>
    <button class="tab-btn" data-panel="bookmarks">
      <svg viewBox="0 0 20 20" fill="currentColor">
        <path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z" />
      </svg>
      お気に入り
    </button>
  </nav>

  <!-- タブパネル -->
  <div id="panel-tabs" class="panel active">
    <!-- ツールバー -->
    <div class="toolbar">
      <button class="toolbar-btn" id="btn-display-mode" title="表示モード切替" data-i18n-title="displayMode">
        <svg viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd"
            d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h6a1 1 0 110 2H4a1 1 0 01-1-1z"
            clip-rule="evenodd" />
        </svg>
      </button>
      <button class="toolbar-btn" id="btn-new-tab" title="新しいタブ" data-i18n-title="toolbarNewTab">
        <svg viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd"
            d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
            clip-rule="evenodd" />
        </svg>
        <span data-i18n="toolbarNewTab">新しいタブ</span>
      </button>
      <div class="toolbar-right">
        <button class="toolbar-btn" id="btn-toggle-mini-tree" title="ミニツリーを表示/非表示"
          data-i18n-title="toolbarToggleMiniTree">
          <svg viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd"
              d="M3 4a1 1 0 011-1h12a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V4zm1 1v10h3V5H4zm4 10h7V5H8v10z"
              clip-rule="evenodd" />
          </svg>
        </button>
        <button class="toolbar-btn" id="btn-sessions" title="セッション管理" data-i18n-title="toolbarSessions">
          <svg viewBox="0 0 20 20" fill="currentColor">
            <path
              d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z" />
          </svg>
        </button>
        <button class="toolbar-btn" id="btn-sort-mode" title="並び順: ツリー" data-i18n-title="sortTree">
          <svg viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z"
              clip-rule="evenodd" />
          </svg>
        </button>
        <button class="toolbar-btn" id="btn-toggle-all" title="すべて展開/折りたたむ" data-i18n-title="toolbarToggleAll">
          <svg viewBox="0 0 20 20" fill="currentColor" class="toggle-all-icon">
            <path fill-rule="evenodd"
              d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
              clip-rule="evenodd" />
          </svg>
        </button>
      </div>
    </div>

    <!-- タブツリー表示エリア -->
    <div class="tree-container" id="tab-tree">
      <div class="loading" data-i18n="msgLoading">読み込み中...</div>
    </div>
  </div>

  <!-- 履歴パネル -->
  <div id="panel-history" class="panel">
    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
          clip-rule="evenodd" />
      </svg>
      <input type="text" id="history-search" placeholder="履歴を検索..." data-i18n-placeholder="historySearchPlaceholder"
        class="search-input">
      <button class="toolbar-btn" id="btn-refresh-history" title="更新" data-i18n-title="btnRefreshHistory">
        <svg viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd"
            d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1z"
            clip-rule="evenodd" />
        </svg>
      </button>
    </div>
    <div class="list-container" id="history-list">
      <div class="loading" data-i18n="msgLoading">読み込み中...</div>
    </div>
  </div>

  <!-- お気に入りパネル -->
  <div id="panel-bookmarks" class="panel">
    <div class="sort-bar">
      <span class="sort-label" data-i18n="sortLabel">並び順:</span>
      <div class="sort-buttons">
        <button class="sort-btn active" data-sort="recent-used" data-i18n="sortRecentUsed">最近利用</button>
        <button class="sort-btn" data-sort="recent-added" data-i18n="sortRecentAdded">最近追加</button>
        <button class="sort-btn" data-sort="most-visited" data-i18n="sortMostVisited">頻度順</button>
        <button class="sort-btn" data-sort="tree" data-i18n="sortTree">ツリー</button>
      </div>
    </div>
    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
          clip-rule="evenodd" />
      </svg>
      <input type="text" id="bookmark-search" placeholder="お気に入りを検索..."
        data-i18n-placeholder="bookmarkSearchPlaceholder" class="search-input">
    </div>
    <div class="list-container" id="bookmark-list">
      <div class="loading" data-i18n="msgLoading">読み込み中...</div>
    </div>
  </div>

  <!-- リーディングリストパネル -->
  <div id="panel-readingList" class="panel">
    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
          clip-rule="evenodd" />
      </svg>
      <input type="text" id="reading-list-search" placeholder="リストを検索..." class="search-input">
    </div>
    <div class="list-container" id="reading-list-container">
      <div class="loading" data-i18n="msgLoading">読み込み中...</div>
    </div>
  </div>

  <!-- 設定パネル -->
  <div id="panel-settings" class="panel">
    <div class="settings-container">
      <h2 class="settings-title" data-i18n="settingsTitle">タブの表示設定</h2>
      <p class="settings-desc" data-i18n="settingsDesc">ドラッグ＆ドロップで並び替え、チェックボックスで表示/非表示を切り替えます。</p>
      <div id="tab-visibility-list" class="settings-list">
        <!-- JSで動的に生成 -->
      </div>

      <hr class="settings-divider">
      <h3 class="settings-subtitle" data-i18n="settingsOtherTitle">その他の設定</h3>

      <div class="settings-list" id="other-settings-list">
        <div class="settings-item-normal" style="flex-direction: column; align-items: flex-start; gap: 10px;">
          <div class="settings-item-label" data-i18n="settingsThemeColor">テーマカラー</div>
          <div class="theme-color-swatches" id="theme-color-swatches">
            <button class="color-swatch" data-color="blue" style="background:#89b4fa" title="Blue"></button>
            <button class="color-swatch" data-color="green" style="background:#a6e3a1" title="Green"></button>
            <button class="color-swatch" data-color="yellow" style="background:#f9e2af" title="Yellow"></button>
            <button class="color-swatch" data-color="red" style="background:#f38ba8" title="Red"></button>
            <button class="color-swatch" data-color="purple" style="background:#cba6f7" title="Purple"></button>
            <button class="color-swatch" data-color="pink" style="background:#f5c2e7" title="Pink"></button>
            <label class="color-swatch color-swatch-custom" title="Custom color"
              style="cursor:pointer; overflow:hidden; position:relative;">
              <span style="font-size:16px; line-height:1; pointer-events:none;">🎨</span>
              <input type="color" id="setting-theme-custom"
                style="opacity:0; position:absolute; inset:0; width:100%; height:100%; cursor:pointer; border:none; padding:0;">
            </label>
          </div>
        </div>
        <label class="settings-item-normal">
          <div class="settings-item-label" data-i18n="settingsColorScheme">外観モード</div>
          <select id="setting-color-scheme" class="settings-select">
            <option value="auto" data-i18n="schemeSystem">システム設定</option>
            <option value="light" data-i18n="schemeLight">ライト</option>
            <option value="dark" data-i18n="schemeDark">ダーク</option>
          </select>
        </label>

        <label class="settings-item-normal">
          <div class="settings-item-label" data-i18n="settingsTabDisplayMode">タブの表示モード</div>
          <select id="setting-display-mode" class="settings-select">
            <option value="full" data-i18n="modeFull">標準</option>
            <option value="compact" data-i18n="modeCompact">コンパクト</option>
            <option value="mini" data-i18n="modeMini">ミニ</option>
          </select>
        </label>

        <label class="settings-item-normal">
          <div class="settings-item-label" data-i18n="settingsHistoryRecentlyClosed">履歴: 最近閉じたタブを表示</div>
          <input type="checkbox" id="setting-history-recent" class="settings-checkbox">
        </label>

        <label class="settings-item-normal">
          <div class="settings-item-label" data-i18n="settingsBookmarkVisitCount">お気に入り: 頻度順で回数を表示</div>
          <input type="checkbox" id="setting-bookmark-visit" class="settings-checkbox">
        </label>

        <label class="settings-item-normal">
          <div class="settings-item-label" data-i18n="settingsSidePanelSide">サイドパネルの位置（左/右）</div>
          <select id="setting-side-panel-side" class="settings-select">
            <option value="right" data-i18n="sideRight">右</option>
            <option value="left" data-i18n="sideLeft">左</option>
          </select>
        </label>

        <label class="settings-item-normal">
          <div class="settings-item-label" data-i18n="settingsMiniTreeWidth">ミニツリーの幅</div>
          <div class="settings-item-value"
            style="display: flex; align-items: center; gap: 10px; flex: 1; justify-content: flex-end;">
            <input type="range" id="setting-mini-tree-width" min="40" max="300" step="10"
              style="flex: 1; max-width: 120px;">
            <span id="mini-tree-width-value" style="font-size: 12px; color: var(--text); min-width: 35px;">90px</span>
          </div>
        </label>

        <label class="settings-item-normal">
          <div class="settings-item-label" data-i18n="settingsFocusEffect">フォーカス効果の強度</div>
          <select id="setting-focus-intensity" class="settings-select">
            <option value="none" data-i18n="focusNone">なし</option>
            <option value="low" data-i18n="focusLow">控えめ</option>
            <option value="medium" data-i18n="focusMedium">標準</option>
            <option value="high" data-i18n="focusHigh">強力</option>
          </select>
        </label>

        <label class="settings-item-normal">
          <div class="settings-item-label" data-i18n="settingsToggleSize">開閉ボタンの大きさ</div>
          <select id="setting-toggle-size" class="settings-select">
            <option value="small" data-i18n="sizeSmall">小</option>
            <option value="medium" data-i18n="sizeMedium">中</option>
            <option value="large" data-i18n="sizeLarge">大</option>
          </select>
        </label>
      </div>

      <hr class="settings-divider">
      <h3 class="settings-subtitle" data-i18n="settingsShortcutsTitle">ショートカットキー設定</h3>
      <div id="shortcuts-settings-list" class="settings-list">
        <!-- JSで動的に生成 -->
      </div>
    </div>
  </div>

  <!-- セッション管理モーダル -->
  <div id="modal-sessions" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 data-i18n="modalSessionsTitle">セッション管理</h3>
        <button class="modal-close" data-modal="modal-sessions">&times;</button>
      </div>
      <div class="modal-body">
        <!-- 保存セクション -->
        <div class="modal-section">
          <h4 class="modal-section-title" data-i18n="modalSaveSessionTitle">現在のセッションを保存</h4>
          <div class="save-session-form">
            <input type="text" id="session-name-input" placeholder="セッション名を入力..."
              data-i18n-placeholder="sessionNamePlaceholder" class="modal-input">
            <button class="btn-primary" id="btn-confirm-save" data-i18n="btnSave">保存</button>
          </div>
        </div>

        <hr class="modal-divider">

        <!-- 呼び出しセクション -->
        <div class="modal-section">
          <h4 class="modal-section-title" data-i18n="modalLoadSessionTitle">保存済みのセッションを呼び出し</h4>
          <div id="session-list" class="session-list">
            <div class="loading" data-i18n="msgLoading">読み込み中...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- コンテキストメニュー -->
  <div id="context-menu" class="context-menu hidden">
    <ul id="context-menu-items"></ul>
  </div>

  <!-- トースト通知 -->
  <div id="toast" class="toast hidden"></div>

  <script src="panel.js"></script>
</body>

</html>
